<div class="lib-content-wrapper">
  <lib-title-actions-toolbar title="Volumes" [buttons]="buttons" i18n-title>
    <lib-namespace-select *ngIf="(ns.dashboardConnected$ | async) === dashboardDisconnectedState"
      namespacesUrl="/api/namespaces"></lib-namespace-select>
  </lib-title-actions-toolbar>

  <!--scrollable page content-->
  <div class="page-padding lib-flex-grow lib-overflow-auto">
    <lib-table *ngIf="isServerPagination" [config]="config" [data]="processedData" [trackByFn]="pvcTrackByFn"
      [serverPagination]="true" [totalItems]="totalItems" (actionsEmitter)="reactToAction($event)"
      (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)"
      (filterChange)="onFilterChange($event)"></lib-table>

    <lib-table *ngIf="!isServerPagination" [config]="config" [data]="processedData" [trackByFn]="pvcTrackByFn"
      (actionsEmitter)="reactToAction($event)">
    </lib-table>
  </div>
</div>
