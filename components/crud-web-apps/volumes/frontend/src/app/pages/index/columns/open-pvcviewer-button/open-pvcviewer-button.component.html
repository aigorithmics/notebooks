<div>
  <!--Uninitialized Phase-->
  @if (isPhaseUninitialized()) {
    <button
      mat-icon-button
      matTooltip="{{ action.tooltip }}"
      matTooltipClass="custom-tooltip"
      [color]="action.color"
      (click)="emitClickedEvent()"
    >
      <lib-icon [icon]="action.iconInit"></lib-icon>
    </button>
  }

  <!--Ready Phase-->
  @if (isPhaseReady()) {
    <button
      mat-icon-button
      matTooltip="{{ action.tooltip }}"
      matTooltipClass="custom-tooltip"
      [color]="action.color"
      (click)="emitClickedEvent()"
    >
      <lib-icon [icon]="action.iconReady"></lib-icon>
    </button>
  }

  <div
    matTooltipClass="custom-tooltip"
    [matTooltip]="'The PVCViewer is currently starting.'"
    matTooltipClass="custom-tooltip"
  >
    @if (isPhaseWaiting()) {
      <mat-spinner
        [diameter]="24"
        style="margin: 0 auto"
      ></mat-spinner>
    }
  </div>

  <div
    matTooltipClass="custom-tooltip"
    [matTooltip]="'The PVCViewer is currently terminating.'"
    matTooltipClass="custom-tooltip"
  >
    @if (isPhaseTerminating()) {
      <button mat-icon-button disabled>
        <lib-icon [icon]="action.iconInit"></lib-icon>
      </button>
    }
  </div>
</div>
