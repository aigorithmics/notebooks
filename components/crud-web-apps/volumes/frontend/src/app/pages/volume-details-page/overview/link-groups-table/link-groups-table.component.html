@for (linkGroup of linkGroups; track linkGroup.name) {
  <div class="link-groups">
    <div class="group-key">{{ linkGroup.name }}</div>
    <div class="link-group-container">
      <lib-urls [urlList]="linkGroup.links"></lib-urls>
    </div>
  </div>
}

@if (linkGroupsEmpty() && loadCompleted) {
  <div>{{ loadErrorMsg }}</div>
}
