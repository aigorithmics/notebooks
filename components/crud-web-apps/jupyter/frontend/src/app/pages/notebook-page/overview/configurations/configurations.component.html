<div>
  @if (configurations && configurations.length > 0) {
    <div class="config-container">
      @for (config of configurations; track config.name) {
        <button
          class="lib-link reset-button-to-text"
          (click)="openDialog(config)"
        >
          {{ config.name }}
        </button>
      }
    </div>
  }
</div>
<div>
  <ng-content> </ng-content>
</div>
