@if (notebookServerType === 'jupyter') {
  <mat-icon
    svgIcon="jupyterlab-icon"
    aria-hidden="false"
    aria-label="JupyterLab based server"
  ></mat-icon>
}
@if (notebookServerType === 'group-one') {
  <mat-icon
    svgIcon="group-one-icon"
    aria-hidden="false"

  ></mat-icon>
}
@if (notebookServerType === 'group-two') {
  <mat-icon
    svgIcon="group-two-icon"
    aria-hidden="false"
    aria-label="Group Two based server"
  ></mat-icon>
}
